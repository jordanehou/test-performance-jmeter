# ===== Serveur =====
server.port=8080
# Nombre maximal de requêtes traitées en parallèle par Tomcat (valeur par défaut : 200)
server.tomcat.threads.max=200

# ===== Base H2 en mémoire =====
# LOCK_TIMEOUT=10000 : une transaction attend jusqu'à 10 s qu'un verrou se libère
# (utile quand beaucoup d'étudiants s'inscrivent en même temps dans la même filière)
spring.datasource.url=jdbc:h2:mem:inscriptions;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
# Taille du pool de connexions à la base
spring.datasource.hikari.maximum-pool-size=20
# Les tables sont créées au démarrage et supprimées à l'arrêt
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ===== Actuator : suivi du CPU et de la mémoire =====
# Exemples : /actuator/health, /actuator/metrics/process.cpu.usage, /actuator/metrics/jvm.memory.used
management.endpoints.web.exposure.include=health,info,metrics

# ===== Mode démo "lent" =====
# true  : ajoute un traitement lent sur POST /api/inscriptions (simule un service saturé)
# false : fonctionnement normal
demo.slow-mode=false
# Durée du traitement lent (en millisecondes)
demo.slow-delay-ms=300
# Nombre de traitements lents possibles en même temps (les autres attendent leur tour)
demo.slow-concurrency=10
